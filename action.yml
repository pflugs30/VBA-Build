name: "VBA Build"
description: "Build VBA-Enabled Office documents from source code using GitHub Actions."

branding:
  icon: "code"
  color: "blue"

inputs:
  source-dir:
    description: "Relative path to the directory containing the source folders"
    required: false
    default: "src"
  test-framework:
    description: "The test framework to use for the build process."
    required: false
    default: "none"
  office-app:
    description: |
      The Office application to install.
      The default mode is automatic and will detect the app based on the folder name.
      To force a specific app instead, use the options: Excel, Word, PowerPoint or Access.
    required: false
    default: "automatic"
  app-config:
    description: |
      Path to a JSON configuration file for Access database post-build preparation.
      Supports running VBA procedures, setting database properties, removing test
      modules by pattern, and removing VBA references by name.
      Only applies to Access builds (.accdb/.accde).
    required: false
    default: ""

runs:
  using: "composite"
  steps:
    - name: "Install 7-zip"
      shell: pwsh
      run: choco install 7zip.install
    - name: "Run VBA Build"
      id: "run_vba_build"
      shell: pwsh
      run: |
        ${{ github.action_path }}\Main.ps1 `
          -SourceDir "${{ inputs['source-dir'] }}" `
          -TestFramework "${{ inputs['test-framework'] }}" `
          -OfficeAppDetection "${{ inputs['office-app'] }}"
    - name: "Build Access Database (if detected)"
      if: steps.run_vba_build.outputs.has-access-database == 'True'
      id: "build_access"
      uses: ./subactions/msaccess-vcs-build-all
      with:
        source-dir-values: "${{ steps.run_vba_build.outputs.access-folders }}"
        target-dir: "${{ inputs['source-dir'] }}/out"
        compile: "false"
        vcs-url: "https://api.github.com/repos/josef-poetzl/msaccess-vcs-addin/releases/tags/v4.1.2-build"
        expected-sha256: "03e61d7c569cee55a960b23695d9128c79f2b21bff658ea52bc3849a9e351de8"
    - name: "Prepare Access Database (if configured)"
      if: steps.run_vba_build.outputs.has-access-database == 'True' && inputs['app-config'] != ''
      shell: pwsh
      run: |
        $targetDir = "${{ inputs['source-dir'] }}/out"
        $configFile = "${{ inputs['app-config'] }}"
        Get-ChildItem -Path $targetDir -Filter "*.accdb" | ForEach-Object {
          Write-Host "Preparing: $($_.Name)"
          & "${{ github.action_path }}/scripts/Prepare-Application.ps1" `
            -AccessFile $_.FullName -ConfigFile $configFile
        }
    - name: "Build Access ACCDE (if detected, no app-config)"
      if: steps.run_vba_build.outputs.has-access-de == 'True' && inputs['app-config'] == ''
      id: "build_access_de"
      uses: ./subactions/msaccess-vcs-build-all
      with:
        source-dir-values: "${{ steps.run_vba_build.outputs.access-de-folders }}"
        target-dir: "${{ inputs['source-dir'] }}/out"
        compile: "true"
        vcs-url: "https://api.github.com/repos/josef-poetzl/msaccess-vcs-addin/releases/tags/v4.1.2-build"
        expected-sha256: "03e61d7c569cee55a960b23695d9128c79f2b21bff658ea52bc3849a9e351de8"
    - name: "Build ACCDB for ACCDE (if detected, with app-config)"
      if: steps.run_vba_build.outputs.has-access-de == 'True' && inputs['app-config'] != ''
      id: "build_access_de_with_config"
      uses: ./subactions/msaccess-vcs-build-all
      with:
        source-dir-values: "${{ steps.run_vba_build.outputs.access-de-folders }}"
        target-dir: "${{ inputs['source-dir'] }}/out"
        compile: "false"
        vcs-url: "https://api.github.com/repos/josef-poetzl/msaccess-vcs-addin/releases/tags/v4.1.2-build"
        expected-sha256: "03e61d7c569cee55a960b23695d9128c79f2b21bff658ea52bc3849a9e351de8"
    - name: "Prepare ACCDE application (if configured)"
      if: steps.run_vba_build.outputs.has-access-de == 'True' && inputs['app-config'] != ''
      shell: pwsh
      run: |
        $targetDir = "${{ inputs['source-dir'] }}/out"
        $configFile = "${{ inputs['app-config'] }}"
        Get-ChildItem -Path $targetDir -Filter "*.accdb" | ForEach-Object {
          Write-Host "Preparing: $($_.Name)"
          & "${{ github.action_path }}/scripts/Prepare-Application.ps1" `
            -AccessFile $_.FullName -ConfigFile $configFile
        }
    - name: "Compile ACCDE (if detected, with app-config)"
      if: steps.run_vba_build.outputs.has-access-de == 'True' && inputs['app-config'] != ''
      shell: pwsh
      run: |
        $targetDir = "${{ inputs['source-dir'] }}/out"
        Get-ChildItem -Path $targetDir -Filter "*.accdb" | ForEach-Object {
          $accdbPath = $_.FullName
          $accdePath = [System.IO.Path]::ChangeExtension($accdbPath, "accde")
          Write-Host "Compiling: $($_.Name) -> $([System.IO.Path]::GetFileName($accdePath))"
          & "${{ github.action_path }}/scripts/Compile-Accdb.ps1" `
            -SourceFile $accdbPath -DestFile $accdePath
        }
outputs:
  processed-folders:
    description: "Number of folders processed during the build"
    value: ${{ steps.run_vba_build.outputs.processed-folders }}
  successful-builds:
    description: "Number of successful builds completed"
    value: ${{ steps.run_vba_build.outputs.successful-builds }}
  office-apps:
    description: "Comma-separated list of Office applications used"
    value: ${{ steps.run_vba_build.outputs.office-apps }}
  access-folders:
    description: "Comma-separated list of Access database source folders"
    value: ${{ steps.run_vba_build.outputs.access-folders }}
  has-access-database:
    description: "Boolean indicating if any Access database folders were found"
    value: ${{ steps.run_vba_build.outputs.has-access-database }}
  access-de-folders:
    description: "Comma-separated list of Access ACCDE source folders"
    value: ${{ steps.run_vba_build.outputs.access-de-folders }}
  has-access-de:
    description: "Boolean indicating if any Access ACCDE folders were found"
    value: ${{ steps.run_vba_build.outputs.has-access-de }}
  first-access-folder:
    description: "The first Access database folder that was processed (if any)"
    value: ${{ steps.extract_access_folder.outputs.first-access-folder }}
